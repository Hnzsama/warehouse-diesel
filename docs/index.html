 Out <= Stock\"| C[\"Stok Item Berkurang\"]\n        A3[\"Stock Opname\"] -->|\"Adjustment\"| D[\"Stok Fisik & Sistem Sinkron\"]\n    end\n\n    subgraph Managerial[\"Pemilik / Owner Monitoring\"]\n        M1[\"Kelola User / Admin\"] --> U[\"Akses User Controlled\"]\n        M2[\"Monitoring Dashboard\"] --> S[\"Safety Stock Alert (min_stock)\"]\n        M3[\"Unduh Laporan\"] --> R[\"PDF & Excel Instant\"]\n    end\n\`\`\``,
      "02-requirements.md": `# 02. Functional & Non-Functional Requirements\n\n## 1. Functional Requirements (FR)\n\n### 1.1 Modul Master Data (Sparepart & Reference)\n- **FR-MST-01:** Admin dapat mengelola Master Data Sparepart (kode barang, nama barang, lokasi rak, stok awal, stok minimum).\n- **FR-MST-02:** Admin dapat mengelola Kategori Barang, Satuan Unit (cth: Pcs, Set, Dus), dan Supplier.\n- **FR-MST-03:** Sistem menggunakan Soft Deletes (\`deleted_at\`) untuk seluruh master data.\n\n### 1.2 Modul Transaksi & Stock Opname\n- **FR-TRX-01:** Admin dapat menginput Barang Masuk dari Supplier yang secara otomatis **menambah stok**.\n- **FR-TRX-02:** Admin dapat menginput Barang Keluar untuk mekanik/truk yang secara otomatis **mengurangi stok**.\n- **FR-TRX-03 (Proteksi Stok Minus):** Transaksi barang keluar wajib menolak pengeluaran jika Jumlah Keluar > Stok Sisa.\n- **FR-TRX-04 (Stock Opname):** Admin dapat menyesuaikan selisih stok fisik vs sistem akibat barang rusak/hilang.\n\n### 1.3 Modul User Management & RBAC\n- **FR-USR-01:** Pemilik (Owner) & Admin Gudang dapat mengelola akun pengguna (\`GET\`, \`POST\`, \`PUT\`, \`DELETE /users\`).\n- **FR-USR-02:** Pemilik tidak dapat diakseskan ke route mutasi barang/master data operasional (*Read-Only*).\n\n### 1.4 Modul Laporan & Dashboard\n- **FR-REP-01:** Dashboard menampilkan total stok, mutasi barang, Area Chart (\`recharts\`), dan *Safety Stock Alert* (\`min_stock\`).\n- **FR-REP-02:** Sistem dapat mencetak (Print), mengunduh PDF (DomPDF), dan Excel (PhpSpreadsheet) laporan persediaan.\n\n---\n\n## 2. Requirement Verification Matrix (21/21 Checklist Selesai)\n\n\`\`\`mermaid\npie title Status Pemenuhan Requirements Skripsi (100%)\n    \"SUDAH Terlaksana (21)\" : 21\n    \"BELUM Terlaksana (0)\" : 0\n\`\`\`\n\n| No | Requirement Skripsi | Status | Verified Code Location |\n|:---:|:---|:---:|:---|\n| 1 | Pencatatan Otomatis & Real-Time | [x] SUDAH | Inertia.js v3 + React 19 SPA |\n| 2 | Pencegahan Mismatch Stok | [x] SUDAH | Transactional Atomicity Eloquent |\n| 3 | Penyusunan Laporan Instan | [x] SUDAH | ReportController (DomPDF & Excel) |\n| 4 | Metodologi Prototype & Flow UX | [x] SUDAH | Pest Automated Tests (48 Passed) |\n| 5 | Tech Stack Backend: Laravel 13 (PHP 8.5) | [x] SUDAH | \`laravel/framework ^13.17\` |\n| 6 | Tech Stack Frontend: React 19 + Tailwind v4 | [x] SUDAH | \`resources/js/pages/*.tsx\` |\n| 7 | Bridge Library: Inertia.js v3 | [x] SUDAH | \`@inertiajs/react ^3.0\` |\n| 8 | Database: MySQL 8.0 & Eloquent ORM | [x] SUDAH | \`database/migrations/*.php\` |\n| 9 | Auth & RBAC: Fortify + Spatie RBAC | [x] SUDAH | \`spatie/laravel-permission\` |\n| 10 | Hak Akses Admin Gudang (Operational) | [x] SUDAH | Middleware \`role:admin\` |\n| 11 | Hak Akses Pemilik / Owner (Managerial) | [x] SUDAH | Middleware \`role:admin\\|pemilik\` di \`/users\` |\n| 12 | Proteksi Read-Only Transaksi Owner | [x] SUDAH | Route Middleware Intercept |\n| 13 | Dashboard Monitoring & Chart | [x] SUDAH | \`resources/js/pages/dashboard.tsx\` |\n| 14 | Safety Stock Alert (\`min_stock\`) | [x] SUDAH | \`min_stock\` Alert Badge |\n| 15 | Pengelolaan Master Data | [x] SUDAH | Item, Category, Unit, Supplier Controllers |\n| 16 | Barang Masuk (Auto-increment) | [x] SUDAH | IncomingItemController@store |\n| 17 | Barang Keluar (Auto-decrement) | [x] SUDAH | OutgoingItemController@store |\n| 18 | Proteksi Stok Minus | [x] SUDAH | Validation in OutgoingItemController |\n| 19 | Stock Opname / Penyesuaian Stok | [x] SUDAH | StockAdjustmentController |\n| 20 | Laporan PDF, Excel, & Print | [x] SUDAH | ReportController PDF/Excel Export |\n| 21 | Pengujian Black-Box & Automated Test | [x] SUDAH | \`tests/Feature/*.php\` (48 Passed) |`,
      "03-user-flow.md": `# 03. User Flow & Process Diagrams — Gudang Diesel Truk Medan\n\n## 1. Core End-to-End Operational Business Flow\n\n\`\`\`mermaid\nsequenceDiagram\n    autonumber\n    actor A as Admin Gudang\n    participant SYS as "SIM Stok Gudang Diesel"\n    actor O as Pemilik / Owner\n\n    A->>SYS: Login Auth (Fortify + Spatie RBAC)\n    SYS-->>A: Dashboard Monitoring & Safety Stock Alert\n\n    rect rgb(15, 23, 42)\n        note right of A: Alur Barang Masuk (Restock Supplier)\n        A->>SYS: Input Transaksi Barang Masuk (Pilih Supplier & Jumlah)\n        SYS->>SYS: Auto-increment Stok: Stok Baru = Stok Lama + Jumlah\n        SYS-->>A: Stok Ter-update Real-time\n    end\n\n    rect rgb(15, 23, 42)\n        note right of A: Alur Barang Keluar (Pengeluaran Mekanik)\n        A->>SYS: Input Transaksi Barang Keluar (Pilih Item & Jumlah)\n        alt Jumlah Keluar <= Sisa Stok\n            SYS->>SYS: Auto-decrement Stok: Stok Baru = Stok Lama - Jumlah\n            SYS-->>A: Transaksi Berhasil & Stok Berkurang\n        else Jumlah Keluar > Sisa Stok\n            SYS-->>A: Error Exception: Stok Tidak Mencukupi (Proteksi Stok Minus)\n        end\n    end\n\n    rect rgb(15, 23, 42)\n        note right of A: Alur Stock Opname (Penyesuaian Barang Rusak/Hilang)\n        A->>SYS: Input Physical Stock & Alasan Selisih\n        SYS->>SYS: Adjustment Audit Log & Sync Stok Fisik\n        SYS-->>A: Stok Fisik & Sistem Sinkron 100%\n    end\n\n    O->>SYS: Login Pemilik\n    SYS-->>O: Access User Management & Export Laporan PDF/Excel\n\`\`\`\n\n---\n\n## 2. Detail Alur Transaksi Barang Keluar & Proteksi Stok Minus\n\n\`\`\`mermaid\nflowchart TD\n    Start[\"Admin Form Barang Keluar\"] --> PickItem[\"Pilih Sparepart & Ketik Jumlah Keluar\"]\n    PickItem --> CheckStock{\"Validasi System: Jumlah <= Sisa Stok?\"}\n    CheckStock -->|\"Ya (Valid)\"| Deduct[\"Atomik Update Database: Auto-decrement Stok\"]\n    Deduct --> Log[\"Simpan Log Transaksi & Redirect Success\"]\n    CheckStock -->|\"Tidak (Over Limit)\"| Reject[\"Tolak Transaksi: Alert Exception 'Stok Tidak Cukup'\"]\n    Reject --> Reinput[\"Admin Menyesuaikan Input Jumlah\"]\n\`\`\``,
      "04-user-roles.md": `# 04. Aktor & Hak Akses Pengguna (Role-Based Access Control)\n\n---\n\n## Matriks Hak Akses (RBAC)\n\n| Akses Modul | Admin Gudang (Operational) | Pemilik / Owner (Managerial) | Keterangan & Proteksi |\n| :--- | :---: | :---: | :--- |\n| **Master Data Sparepart, Kategori, Satuan, Supplier** | Full CRUD | Read-Only (View) | Owner tidak boleh mengubah master data operasional |\n| **Transaksi Barang Masuk** | Input & Edit | Read-Only (View) | Auto-increment stok saat transaksi disimpan |\n| **Transaksi Barang Keluar** | Input & Edit | Read-Only (View) | Dilengkapi Proteksi Stok Minus |\n| **Stock Opname / Penyesuaian** | Input & Adjust | Read-Only (View) | Dokumentasi selisih stok rusak/hilang |\n| **Kelola Akun Pengguna (\`/users\`)** | Full Access | Full Access | Pemilik & Admin dapat mengelola akun staf |\n| **Dashboard & Safety Stock Alert** | View | View | Statistik real-time & grafik mutasi |\n| **Laporan Persediaan (PDF, Excel, Print)** | View & Export | View & Export | Ekspor instan per periode tanggal |`,
      "05-feature-specification.md": `# 05. Feature Specification — Gudang Diesel Truk Medan\n\n## 1. Modul Operational Admin Gudang\n\n### 1.1 Master Data Sparepart & Referensi\n- **F-MST-01 Management Sparepart:** Pendataan kode suku cadang unik (cth: \`SPR-001\`), nama barang, lokasi rak penyimpanan, stok awal, dan stok minimum.\n- **F-MST-02 Management Kategori & Satuan Unit:** Pengelompokan jenis sparepart (Mesin, Filter, Oli) dan satuan barang (Pcs, Set, Unit, Dus).\n- **F-MST-03 Management Supplier:** Pendataan supplier penyedia suku cadang lengkap dengan alamat dan nomor kontak.\n\n### 1.2 Transaksi Mutasi Barang\n- **F-TRX-01 Transaksi Barang Masuk (Restock):** Input tanggal penerimaan, supplier, jumlah barang masuk, nomor faktur/surat jalan, dan bukti foto invoice. Stok barang bertambah otomatis (*Auto-increment*).\n- **F-TRX-02 Transaksi Barang Keluar (Pengeluaran):** Input tanggal pengeluaran, jumlah barang keluar, penerima (mekanik/nomor truk), dan catatan. Stok barang berkurang otomatis (*Auto-decrement*).\n- **F-TRX-03 Proteksi Stok Minus:** Sistem me-reject transaksi barang keluar jika jumlah keluar melebihi sisa stok item yang tersedia.\n\n### 1.3 Stock Opname (Penyesuaian Stok)\n- **F-OPN-01 Penyesuaian Stok Rusak/Hilang:** Input jumlah persediaan fisik riil hasil pengecekan gudang, catatan selisih, dan alasan adjustment. Sistem memperbarui stok sistem agar 100% konsisten dengan fisik.\n\n---\n\n## 2. Modul Manajerial & Supervision Pemilik (Owner)\n\n### 2.1 Dashboard Monitoring & Safety Stock Alert\n- **F-DSH-01 Indicator Cards:** Menampilkan total item sparepart, total unit barang, total transaksi masuk, dan total transaksi keluar.\n- **F-DSH-02 Area Chart Mutasi:** Grafik tren barang masuk vs barang keluar bulanan menggunakan \`recharts\`.\n- **F-DSH-03 Safety Stock Alert:** Peringatan visual warna kuning/merah untuk item barang yang sisa stoknya <= stok minimum (\`min_stock\`).\n\n### 2.2 Management Akun Pengguna & Laporan\n- **F-USR-01 User Management:** Menginput, memperbarui, dan menghapus akses akun pengguna/admin gudang (\`/users\`).\n- **F-REP-01 Instant PDF & Excel Export:** Mengunduh laporan rekapitulasi persediaan dan mutasi barang per rentang tanggal dalam format PDF (DomPDF) dan Excel (PhpSpreadsheet).`,
      "06-page-specification.md": `# 06. Page Specification — Gudang Diesel Truk Medan\n\nDokumen ini mendeskripsikan seluruh halaman React SPA pada aplikasi beserta komponen, Inertia routes, dan fungsinya.\n\n---\n\n## 1. Dashboard Monitoring (\`/dashboard\`)\n* **Route Component:** \`resources/js/pages/dashboard.tsx\`\n* **Elemen UI:** Indicator Cards (Total Item, Total Unit, Mutasi Masuk/Keluar), Area Chart (\`recharts\`) Mutasi Barang, Tabel Safety Stock Alert (\`min_stock\`), Ringkasan Aktivitas Terakhir.\n\n## 2. Master Data Sparepart (\`/items\`)\n* **Route Component:** \`resources/js/pages/Items/Index.tsx\`\n* **Elemen UI:** Data Table Sparepart (Kode, Nama, Lokasi Rak, Satuan, Kategori, Stok Sisa, Minimum Stok, Status Safety Stock), Modal Tambah/Edit Item, Filter Kategori & Rak, Action Soft Delete & Restore.\n\n## 3. Master Data Kategori, Satuan & Supplier (\`/categories\`, \`/units\`, \`/suppliers\`)\n* **Route Component:** \`resources/js/pages/Categories/Index.tsx\`, \`Units/Index.tsx\`, \`Suppliers/Index.tsx\`\n* **Elemen UI:** Data Table Kategori, Satuan Unit, dan Supplier, Form Modal CRUD, Action Soft Delete.\n\n## 4. Transaksi Barang Masuk (\`/incoming-items\`)\n* **Route Component:** \`resources/js/pages/IncomingItems/Index.tsx\`\n* **Elemen UI:** Form Modal Input Barang Masuk (Select Item, Select Supplier, Jumlah, Tanggal, No. Invoice, Foto Faktur), Data Table Mutasi Masuk, Auto-increment Stok.\n\n## 5. Transaksi Barang Keluar (\`/outgoing-items\`)\n* **Route Component:** \`resources/js/pages/OutgoingItems/Index.tsx\`\n* **Elemen UI:** Form Modal Input Barang Keluar (Select Item, Jumlah, Tanggal, Penerima Mekanik/Truk, Catatan), Proteksi Stok Minus Real-time, Data Table Mutasi Keluar, Auto-decrement Stok.\n\n## 6. Stock Opname / Penyesuaian Stok (\`/stock-adjustments\`)\n* **Route Component:** \`resources/js/pages/StockAdjustments/Index.tsx\`\n* **Elemen UI:** Form Modal Adjust (Select Item, Stok Sistem, Input Stok Fisik, Hitung Selisih Otomatis, Catatan Alasan), Audit Log Penyesuaian Stok.\n\n## 7. Kelola Pengguna / User Management (\`/users\`)\n* **Route Component:** \`resources/js/pages/Users/Index.tsx\`\n* **Elemen UI:** Data Table User & Role Badge (Admin / Pemilik), Modal Tambah/Edit User, Dialog Hapus User (Pemilik & Admin Access).\n\n## 8. Laporan Persediaan & Mutasi (\`/reports\`)\n* **Route Component:** \`resources/js/pages/Reports/Index.tsx\`\n* **Elemen UI:** Filter Rentang Tanggal & Kategori, Preview Tabel Laporan, Tombol Cetak (Print Layout), Tombol Download PDF (DomPDF), Tombol Download Excel (PhpSpreadsheet).`,
      "07-ui-ux-guidelines.md": `# 07. UI/UX Guidelines — Gudang Diesel Truk Medan\n\n## 1. Aesthetic Principles\n- **Modern Clean Dark Mode:** Menggunakan palette warna slate dark (\`#0f172a\`, \`#0284c7\`), glassmorphism cards, subtle border highlights, dan font modern **Plus Jakarta Sans** / **Inter**.\n- **Visual Feedback:** State indikator yang jelas saat stok kritis (Alert Badge Kuning/Merah), loading spinner saat transaksi disimpan, dan toast notification.\n\n## 2. Color Palette & Status Badges\n- **Primary Brand:** Sky Blue / Indigo (\`#0284c7\`, \`#6366f1\`)\n- **Safety Stock Normal:** Emerald Green Badge (\`Stok Aman\`)\n- **Safety Stock Warning:** Amber / Yellow Badge (\`Mendekati Minimum\`)\n- **Safety Stock Danger:** Rose / Red Badge (\`Stok Kritis / Habis\`)\n- **Role Admin Gudang:** Sky Blue Badge (\`Admin Gudang\`)\n- **Role Pemilik:** Amber Crown Badge (\`Pemilik / Owner\`)\n\n## 3. Form Validation & Error Messaging\n- Form transaksi barang keluar memvalidasi porsi sisa stok secara real-time dan menampilkan pesan error merah jika \`jumlah > sisa_stok\`.`,
      "08-data-model.md": `# 08. Data Model & Database Schema — Gudang Diesel Truk Medan\n\n## 1. Entity Relationship Diagram (ERD)\n\n\`\`\`mermaid\nerDiagram\n    CATEGORIES ||--o{ ITEMS : "classifies"\n    UNITS ||--o{ ITEMS : "measures"\n    SUPPLIERS ||--o{ INCOMING_ITEMS : "supplies"\n    SUPPLIERS ||--o{ OUTGOING_ITEMS : "references"\n    ITEMS ||--o{ INCOMING_ITEMS : "received_in"\n    ITEMS ||--o{ OUTGOING_ITEMS : "issued_in"\n    ITEMS ||--o{ STOCK_ADJUSTMENTS : "adjusted_in"\n    USERS ||--o{ TRANSACTION_EDIT_LOGS : "logs"\n\n    CATEGORIES {\n        bigint id PK\n        string name\n        string slug UK\n        timestamp deleted_at\n    }\n\n    UNITS {\n        bigint id PK\n        string name\n        string symbol\n        timestamp deleted_at\n    }\n\n    SUPPLIERS {\n        bigint id PK\n        string name\n        string phone\n        text address\n        timestamp deleted_at\n    }\n\n    ITEMS {\n        bigint id PK\n        string code UK\n        string name\n        bigint category_id FK\n        bigint unit_id FK\n        string rack_location\n        integer stock\n        integer min_stock\n        timestamp deleted_at\n    }\n\n    INCOMING_ITEMS {\n        bigint id PK\n        bigint item_id FK\n        bigint supplier_id FK\n        integer quantity\n        date transaction_date\n        string invoice_number\n        string invoice_image\n        timestamp deleted_at\n    }\n\n    OUTGOING_ITEMS {\n        bigint id PK\n        bigint item_id FK\n        bigint supplier_id FK\n        integer quantity\n        date transaction_date\n        string recipient\n        text notes\n        timestamp deleted_at\n    }\n\n    STOCK_ADJUSTMENTS {\n        bigint id PK\n        bigint item_id FK\n        integer system_stock\n        integer physical_stock\n        integer difference\n        text reason\n        timestamp created_at\n    }\n\`\`\`\n\n---\n\n## 2. Table Specifications\n\n### 2.1 \`items\` (Master Sparepart)\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| \`id\` | BigIncrements | Primary Key | ID Item Sparepart |\n| \`code\` | String | Unique, Not Null | Kode Unik Sparepart (cth: \`SPR-001\`) |\n| \`name\` | String | Not Null | Nama Suku Cadang |\n| \`category_id\` | ForeignId | Constrained \`categories\` | ID Kategori Barang |\n| \`unit_id\` | ForeignId | Constrained \`units\` | ID Satuan Unit |\n| \`rack_location\` | String | Nullable | Lokasi Rak Penyimpanan (cth: \`Rak A-02\`) |\n| \`stock\` | Integer | Default \`0\` | Sisa Stok Fisik Real-time |\n| \`min_stock\` | Integer | Default \`5\` | Ambang Batas Minimum Safety Stock |\n| \`deleted_at\` | Timestamp | Nullable | **Soft Delete** |\n\n### 2.2 \`incoming_items\` (Transaksi Barang Masuk)\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| \`id\` | BigIncrements | Primary Key | ID Transaksi Masuk |\n| \`item_id\` | ForeignId | Constrained \`items\` | Barang yang Diterima |\n| \`supplier_id\` | ForeignId | Constrained \`suppliers\` | Supplier Penyedia |\n| \`quantity\` | Integer | Not Null | Jumlah Unit Diterima |\n| \`transaction_date\` | Date | Not Null | Tanggal Transaksi Masuk |\n| \`invoice_number\` | String | Nullable | Nomor Faktur / Surat Jalan |\n| \`invoice_image\` | String | Nullable | Path Foto Bukti Faktur |\n| \`deleted_at\` | Timestamp | Nullable | **Soft Delete** |\n\n### 2.3 \`outgoing_items\` (Transaksi Barang Keluar)\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| \`id\` | BigIncrements | Primary Key | ID Transaksi Keluar |\n| \`item_id\` | ForeignId | Constrained \`items\` | Barang yang Dikeluarkan |\n| \`quantity\` | Integer | Not Null | Jumlah Unit Dikeluarkan |\n| \`transaction_date\` | Date | Not Null | Tanggal Pengeluaran |\n| \`recipient\` | String | Nullable | Penerima (Mekanik / No. Truk) |\n| \`notes\` | Text | Nullable | Catatan Peruntukan Barang |\n| \`deleted_at\` | Timestamp | Nullable | **Soft Delete** |\n\n### 2.4 \`stock_adjustments\` (Stock Opname)\n| Column Name | Type | Constraints | Description |\n| :--- | :--- | :--- | :--- |\n| \`id\` | BigIncrements | Primary Key | ID Stock Opname |\n| \`item_id\` | ForeignId | Constrained \`items\` | Barang yang Disesuaikan |\n| \`system_stock\` | Integer | Not Null | Jumlah Stok Menurut Sistem |\n| \`physical_stock\` | Integer | Not Null | Jumlah Stok Fisik Hasil Opname |\n| \`difference\` | Integer | Not Null | Selisih ($Physical - System$) |\n| \`reason\` | Text | Nullable | Alasan Adjustment (Rusak/Hilang) |`,
      "09-stock-mutation-flow.md": `# 09. Stock Mutation Flow & Transaction Logic\n\n## 1. Formulas Mutasi Stok Atomik\n\nSetiap transaksi barang masuk dan keluar dihitung secara atomik pada database Eloquent transaction:\n\n$$\\text{Stok Akhir} = \\text{Stok Awal} + \\text{Barang Masuk} - \\text{Barang Keluar}$$\n\n---\n\n## 2. Transaksi Barang Masuk (Auto-increment)\n- **Input:** Tanggal, Item, Supplier, Jumlah Masuk, No. Faktur.\n- **Efek Stok:** \`Item::increment('stock', $quantity)\`  \n\n---\n\n## 3. Transaksi Barang Keluar (Auto-decrement & Proteksi Stok Minus)\n- **Input:** Tanggal, Item, Jumlah Keluar, Penerima.\n- **Validasi Rule:**\n\`\`\`php\nif ($quantity > $item->stock) {\n    return back()->withErrors(['quantity' => 'Jumlah barang keluar melebihi stok sisa!']);\n}\n\`\`\`\n- **Efek Stok:** \`Item::decrement('stock', $quantity)\``,
      "10-stock-opname-flow.md": `# 10. Stock Opname & Adjustment Logic\n\n## 1. Alur Penyesuaian Stok Rusak/Hilang\n\nProses Stock Opname membandingkan jumlah persediaan menurut sistem dengan pengecekan fisik di gudang:\n\n$$\\text{Selisih} = \\text{Stok Fisik} - \\text{Stok Sistem}$$\n\n---\n\n## 2. Audit Trail Adjustment\n1. Admin memasukkan data \`physical_stock\` dan \`reason\` (cth: Barang Rusak / Hilang).\n2. Sistem mencatat record pada tabel \`stock_adjustments\`.\n3. Sistem memperbarui \`stock\` pada tabel \`items\` menjadi sama dengan \`physical_stock\`.`,
      "11-demo-scenarios.md": `# 11. Demo Scenarios & Test Script Skripsi\n\n## 1. Skenario 1: Transaksi Barang Masuk (Restock Supplier)\n1. Login sebagai Admin (\`admin@gudangdiesel.com\`).\n2. Masuk ke halaman **Barang Masuk** -> Klik **Tambah Barang Masuk**.\n3. Pilih Sparepart (cth: Filter Oli \`SPR-001\`), pilih Supplier, dan ketik jumlah \`10\`.\n4. Simpan. Verifikasi bahwa stok Filter Oli bertambah 10 unit secara otomatis.\n\n---\n\n## 2. Skenario 2: Transaksi Barang Keluar & Proteksi Stok Minus\n1. Masuk ke halaman **Barang Keluar** -> Klik **Tambah Barang Keluar**.\n2. Coba masukkan jumlah keluar melebihi stok yang ada (misal stok sisa 5, diinput 20).\n3. Verifikasi bahwa sistem **menolak transaksi** dengan pesan peringatan merah.\n4. Ubah jumlah menjadi 2 (valid). Simpan. Verifikasi bahwa stok sisa berkurang 2.\n\n---\n\n## 3. Skenario 3: Pemilik Access & Ekspor Laporan\n1. Login sebagai Pemilik (\`pemilik@gudangdiesel.com\`).\n2. Verifikasi bahwa menu mutasi operasional terkunci (*Read-Only*).\n3. Masuk ke halaman **Laporan** -> Klik tombol **Download PDF** / **Excel**. Laporan terunduh instan.`,
      "12-technical-guidelines.md": `# 12. Technical Guidelines & Stack Architecture\n\n## 1. Stack Technology Overview\n\n\`\`\`mermaid\nflowchart TD\n    subgraph Frontend[\"Frontend Layer (SPA)\"]\n        React[\"React 19 / TSX\"]\n        Inertia[\"Inertia.js v3\"]\n        Tailwind[\"Tailwind CSS v4\"]\n        Recharts[\"Recharts Charts\"]\n    end\n\n    subgraph Backend[\"Backend Layer (Laravel)\"]\n        PHP[\"PHP 8.5\"]\n        Laravel[\"Laravel 13 Framework\"]\n        Fortify[\"Laravel Fortify Auth\"]\n        Spatie[\"Spatie Permission RBAC\"]\n        DomPDF[\"Laravel DomPDF\"]\n        PhpSpreadsheet[\"PhpSpreadsheet Excel\"]\n    end\n\n    subgraph DB[\"Data Layer\"]\n        MySQL[\"MySQL 8.0 / SQLite\"]\n    end\n\n    Frontend <-->|\"Inertia Protocol\"| Backend\n    Backend <--> DB\n\`\`\`\n\n---\n\n## 2. Key Commands\n- \`php artisan serve\`: Running local dev server.\n- \`npm run dev\`: Running Vite dev server.\n- \`php artisan test --compact\`: Running Pest automated tests (48 Passed).\n- \`vendor/bin/pint --dirty --format agent\`: Code formatting.`,
      "13-development-rules.md": `# 13. Development Rules & Standards\n\n1. **Strict Scope Control:** Setiap fitur wajib mengacu pada scope skripsi Gudang Diesel Truk Medan.\n2. **Test Driven Verification:** Seluruh perubahan fitur mutasi stok wajib dilengkapi unit/feature test Pest.\n3. **Pint Formatting:** Seluruh berkas PHP wajib diformat menggunakan \`vendor/bin/pint --dirty --format agent\`.`,
      "14-out-of-scope.md": `# 14. Out of Scope Features\n\nFitur-fitur berikut berada di luar lingkup (out-of-scope) pengembangan SIM Stok Gudang Diesel Truk Medan:\n- Modul Kasir / Point of Sale (POS).\n- Integrasi Payment Gateway & E-Commerce.\n- Akuntansi Keuangan Kompleks (Jurnal Umum, Buku Besar Keuangan, Utang-Piutang).\n- Aplikasi Mobile Native (Android/iOS).`,
      "15-acceptance-criteria.md": `# 15. Acceptance Criteria & Definition of Done\n\n## 1. Quality Gate Overview\n\n\`\`\`mermaid\nflowchart TD\n    AC1[1. Auto-increment Stok Barang Masuk] --> GATE{Definition of Done}\n    AC2[2. Auto-decrement Stok & Proteksi Stok Minus] --> GATE\n    AC3[3. Stock Opname Adjustment Audit Log] --> GATE\n    AC4[4. RBAC: User Management di Pemilik & Admin] --> GATE\n    AC5[5. Dashboard Monitoring & Safety Stock Alert] --> GATE\n    AC6[6. Ekspor Instan PDF & Excel + Print Layout] --> GATE\n    GATE -- Pass All 48 Tests --> PASSED[PROYEK DEMO ACC / 100% COMPLETE]\n\`\`\`\n\n---\n\n## 2. Checklist Verification Criteria\n\n- [x] Transaksi **Barang Masuk** secara otomatis menambah jumlah stok item pada database.\n- [x] Transaksi **Barang Keluar** secara otomatis mengurangi jumlah stok item pada database.\n- [x] Transaksi **Barang Keluar** wajib menolak pengeluaran jika jumlah keluar melebihi stok sisa (**Proteksi Stok Minus**).\n- [x] **Stock Opname** dapat menyimpan selisih fisik vs sistem dan meng-update persediaan fisik riil secara atomik.\n- [x] **Pemilik (Owner)** dan **Admin** dapat mengelola akun pengguna (\`/users\`).\n- [x] **Pemilik (Owner)** dilindungi middleware dari melakukan mutasi transaksi operasional (*Read-Only Transaction*).\n- [x] **Dashboard Monitoring** menampilkan total stok, mutasi barang, grafik \`recharts\`, dan visual- [x] Laporan persediaan dan mutasi dapat diekspor secara instan ke format **PDF** (\`barryvdh/laravel-dompdf\`) dan **Excel** (\`phpoffice/phpspreadsheet\`).\n- [x] Seluruh skenario fungsional terverifikasi lulus **48 Pest Automated Unit & Feature Tests**.`
    };

    const filenames = Object.keys(docsData).sort();

    const docIcons = {
      "00-project-overview.md": "fa-compass",
      "01-scope.md": "fa-bullseye",
      "02-requirements.md": "fa-list-check",
      "03-user-flow.md": "fa-diagram-project",
      "04-user-roles.md": "fa-user-shield",
      "05-feature-specification.md": "fa-cubes",
      "06-page-specification.md": "fa-laptop-code",
      "07-ui-ux-guidelines.md": "fa-palette",
      "08-data-model.md": "fa-database",
      "09-stock-mutation-flow.md": "fa-calculator",
      "10-stock-opname-flow.md": "fa-sliders",
      "11-demo-scenarios.md": "fa-flask",
      "12-technical-guidelines.md": "fa-code",
      "13-development-rules.md": "fa-gavel",
      "14-out-of-scope.md": "fa-ban",
      "15-acceptance-criteria.md": "fa-circle-check"
    };

    let currentFile = filenames[0];

    const themeToggleBtn = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");
    
    function initTheme() {
      if (localStorage.theme === 'light') {
        document.documentElement.classList.remove('dark');
        themeIcon.className = 'fa-solid fa-sun';
      } else {
        document.documentElement.classList.add('dark');
        themeIcon.className = 'fa-solid fa-moon';
      }
    }

    themeToggleBtn.addEventListener("click", () => {
      if (document.documentElement.classList.contains("dark")) {
        document.documentElement.classList.remove("dark");
        localStorage.theme = "light";
        themeIcon.className = "fa-solid fa-sun";
      } else {
        document.documentElement.classList.add("dark");
        localStorage.theme = "dark";
        themeIcon.className = "fa-solid fa-moon";
      }
      renderMermaid();
    });

    initTheme();

    const mobileMenuBtn = document.getElementById("mobile-menu-btn");
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("sidebar-backdrop");

    function toggleMobileMenu() {
      sidebar.classList.toggle("-translate-x-full");
      backdrop.classList.toggle("hidden");
    }

    mobileMenuBtn.addEventListener("click", toggleMobileMenu);
    backdrop.addEventListener("click", toggleMobileMenu);

    function formatTitle(filename) {
      const nameWithoutExt = filename.replace(".md", "");
      const parts = nameWithoutExt.split("-");
      const num = parts[0];
      const title = parts.slice(1).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
      return { num, title };
    }

    const navContainer = document.getElementById("doc-nav");
    
    function renderNav(filter = "") {
      navContainer.innerHTML = "";
      filenames.forEach(fn => {
        const { num, title } = formatTitle(fn);
        if (filter && !title.toLowerCase().includes(filter.toLowerCase()) && !fn.includes(filter.toLowerCase())) {
          return;
        }

        const btn = document.createElement("button");
        const isActive = fn === currentFile;
        const iconClass = docIcons[fn] || "fa-file";

        btn.className = `w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium flex items-center gap-3 transition-all ${
          isActive 
            ? "bg-sky-600 text-white shadow-md shadow-sky-500/20 font-semibold" 
            : "text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/70"
        }`;

        btn.innerHTML = `
          <i class="fa-solid ${iconClass} text-sm ${isActive ? "text-white" : "text-slate-400 dark:text-slate-500"}"></i>
          <span class="truncate flex-1">${num}. ${title}</span>
        `;

        btn.addEventListener("click", () => {
          window.location.hash = fn;
          if (!sidebar.classList.contains("-translate-x-full")) {
            toggleMobileMenu();
          }
        });

        navContainer.appendChild(btn);
      });
    }

    function renderDoc(filename) {
      if (!docsData[filename]) filename = filenames[0];
      currentFile = filename;

      const { num, title } = formatTitle(filename);
      document.getElementById("current-filename").innerText = filename;
      document.getElementById("current-title").innerText = `${num}. ${title}`;

      const rawMd = docsData[filename];
      const htmlContent = marked.parse(rawMd);

      const container = document.getElementById("markdown-container");
      container.innerHTML = htmlContent;

      // Transform <pre><code class="language-mermaid"> into <div class="mermaid-wrapper"><div class="mermaid">
      container.querySelectorAll('pre code.language-mermaid, pre code.lang-mermaid').forEach((block) => {
        const pre = block.parentElement;
        const wrapper = document.createElement('div');
        wrapper.className = 'mermaid-wrapper';
        
        const innerDiv = document.createElement('div');
        innerDiv.className = 'mermaid';
        innerDiv.textContent = block.textContent;
        
        wrapper.appendChild(innerDiv);
        pre.replaceWith(wrapper);
      });

      renderMermaid();
      renderNav();
      updatePagination();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderMermaid() {
      setTimeout(() => {
        const isDark = document.documentElement.classList.contains("dark");
        mermaid.initialize({
          startOnLoad: false,
          theme: isDark ? "dark" : "default",
          securityLevel: "loose",
          fontFamily: "Inter, sans-serif",
          flowchart: { useMaxWidth: true, htmlLabels: true },
          sequence: { useMaxWidth: true, showSequenceNumbers: true }
        });

        document.querySelectorAll(".mermaid").forEach((el) => {
          const code = el.getAttribute("data-raw") || el.textContent;
          el.setAttribute("data-raw", code);
          el.removeAttribute("data-processed");
          el.innerHTML = code;
          
          try {
            mermaid.run({ nodes: [el] });
          } catch(e) {
            console.error("Mermaid error:", e);
          }
        });
      }, 50);
    }

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const prevLabel = document.getElementById("prev-label");
    const nextLabel = document.getElementById("next-label");

    function updatePagination() {
      const idx = filenames.indexOf(currentFile);
      
      if (idx > 0) {
        prevBtn.disabled = false;
        const prevFn = filenames[idx - 1];
        const { title } = formatTitle(prevFn);
        prevLabel.innerText = title;
        prevBtn.onclick = () => window.location.hash = prevFn;
      } else {
        prevBtn.disabled = true;
        prevLabel.innerText = "Sebelumnya";
      }

      if (idx < filenames.length - 1) {
        nextBtn.disabled = false;
        const nextFn = filenames[idx + 1];
        const { title } = formatTitle(nextFn);
        nextLabel.innerText = title;
        nextBtn.onclick = () => window.location.hash = nextFn;
      } else {
        nextBtn.disabled = true;
        nextLabel.innerText = "Selanjutnya";
      }
    }

    document.getElementById("search-input").addEventListener("input", (e) => {
      renderNav(e.target.value);
    });
    document.getElementById("mobile-search-input").addEventListener("input", (e) => {
      renderNav(e.target.value);
    });

    document.getElementById("copy-markdown-btn").addEventListener("click", () => {
      navigator.clipboard.writeText(docsData[currentFile]);
      const btn = document.getElementById("copy-markdown-btn");
      btn.innerHTML = `<i class="fa-solid fa-check text-emerald-500"></i><span>Tersalin!</span>`;
      setTimeout(() => {
        btn.innerHTML = `<i class="fa-regular fa-copy"></i><span>Salin Raw</span>`;
      }, 2000);
    });

    window.addEventListener("hashchange", () => {
      const hash = window.location.hash.replace("#", "");
      if (filenames.includes(hash)) {
        renderDoc(hash);
      }
    });

    const initialHash = window.location.hash.replace("#", "");
    if (filenames.includes(initialHash)) {
      renderDoc(initialHash);
    } else {
      renderDoc(filenames[0]);
    }
  </script>
</body>
</html>
